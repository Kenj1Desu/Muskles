<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0b0d" />
  <title>Kenji Lifts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0a0b0d;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    .glass {
      background: rgba(17, 18, 21, 0.55);
      backdrop-filter: blur(32px) saturate(210%);
      -webkit-backdrop-filter: blur(32px) saturate(210%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0.5px 0 rgba(255, 255, 255, 0.08), 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }
    .glass-input {
      background: rgba(10, 11, 13, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .stepper-btn {
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .stepper-btn:active {
      transform: scale(0.85);
      background-color: #d2fe1a;
      color: #0a0b0d;
    }
    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: -1;
      opacity: 0.15;
    }
    .tab-pane {
      transition: opacity 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes overloadGlow {
      0%, 100% { box-shadow: 0 0 4px rgba(210, 254, 26, 0.2); }
      50% { box-shadow: 0 0 14px rgba(210, 254, 26, 0.45); }
    }
    .overload-glow {
      animation: overloadGlow 2.5s infinite;
    }
  </style>
</head>
<body class="pb-28">

  <!-- Ambient Light Orbs -->
  <div class="ambient-orb bg-lime-500 w-64 h-64 top-10 -left-20"></div>
  <div class="ambient-orb bg-lime-700 w-80 h-80 top-1/3 -right-32"></div>

  <!-- Sticky Top iOS-Style App Bar -->
  <header class="glass sticky top-0 z-40 px-4 py-3.5 flex justify-between items-center border-t-0 border-x-0">
    <div class="flex items-center gap-2.5">
      <!-- Rift-Inspired Cyber Barbell Logo -->
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-lime-500 via-lime-400 to-[#d2fe1a] flex items-center justify-center shadow-lg shadow-lime-500/10">
        <span class="text-slate-950 font-extrabold text-base tracking-tighter">R</span>
      </div>
      <div>
        <h1 class="text-base font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-100 to-[#d2fe1a] bg-clip-text text-transparent">KENJI LIFTS</h1>
        <p id="user-stats-banner" class="text-[10px] text-slate-500 font-semibold tracking-wide uppercase">BW: -- kg</p>
      </div>
    </div>
    
    <!-- Stopwatch Badge -->
    <button onclick="toggleTimerModal()" id="timer-badge" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-950/80 border border-white/5 hover:border-[#d2fe1a]/50 text-[10px] font-bold text-[#d2fe1a] transition">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span id="timer-display" class="tracking-widest">REST</span>
    </button>
  </header>

  <!-- Main Container -->
  <main class="p-4 max-w-md mx-auto space-y-4 relative z-10">

    <!-- TAB 1: WORKOUT LOGGING -->
    <section id="tab-log" class="space-y-4 tab-pane">
      
      <!-- Split Pills -->
      <div class="space-y-2">
        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block pl-1">Workout Split</label>
        <div class="grid grid-cols-2 gap-2" id="split-buttons"></div>
      </div>

      <!-- Exercise Selector Dropdown -->
      <div class="space-y-2">
        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block pl-1">Selected Exercise</label>
        <div class="relative">
          <select id="exercise-select" onchange="renderExerciseDetails()" class="w-full appearance-none glass rounded-2xl px-4 py-3.5 text-sm font-semibold text-slate-100 focus:outline-none focus:border-[#d2fe1a] pr-10 shadow-sm"></select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-[#d2fe1a]">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
          </div>
        </div>
      </div>

      <!-- Live Exercise Frosted Card -->
      <div class="glass rounded-3xl p-5 space-y-4 shadow-2xl relative overflow-hidden">
        <div class="flex justify-between items-center">
          <span id="target-muscle-badge" class="text-[10px] font-extrabold px-3 py-1 rounded-full bg-[#d2fe1a]/10 text-[#d2fe1a] border border-[#d2fe1a]/20 tracking-widest uppercase">CHEST</span>
          <span id="lift-rating-badge" class="text-xs font-bold text-amber-400/90 tracking-wide">Rating: --</span>
        </div>

        <!-- Previous Log Banner -->
        <div class="glass-input p-3.5 rounded-2xl border border-white/5 text-[11px] leading-relaxed">
          <span class="text-slate-500 font-bold tracking-widest uppercase block mb-1">Previous Session</span>
          <p id="prev-log-display" class="text-slate-300 italic">No logged lifts for this exercise.</p>
        </div>

        <!-- Stepper Input Section -->
        <div class="space-y-4">
          <div class="grid grid-cols-2 gap-3.5">
            
            <!-- Weight Input with Steppers -->
            <div class="glass-input p-3 rounded-2xl border border-white/5 space-y-1.5">
              <label class="text-[10px] font-bold text-slate-500 block text-center uppercase tracking-widest">Weight (kg)</label>
              <div class="flex items-center justify-between">
                <button onclick="adjustInput('input-weight', -2.5)" class="stepper-btn w-9 h-9 rounded-xl bg-[#1a1b1f] border border-white/5 text-slate-200 font-bold text-lg flex items-center justify-center">-</button>
                <input type="number" id="input-weight" placeholder="0" step="0.5" class="w-full bg-transparent text-center font-black text-xl text-[#d2fe1a] focus:outline-none" />
                <button onclick="adjustInput('input-weight', 2.5)" class="stepper-btn w-9 h-9 rounded-xl bg-[#1a1b1f] border border-white/5 text-slate-200 font-bold text-lg flex items-center justify-center">+</button>
              </div>
            </div>

            <!-- Reps Input with Steppers -->
            <div class="glass-input p-3 rounded-2xl border border-white/5 space-y-1.5">
              <label class="text-[10px] font-bold text-slate-500 block text-center uppercase tracking-widest">Reps</label>
              <div class="flex items-center justify-between">
                <button onclick="adjustInput('input-reps', -1)" class="stepper-btn w-9 h-9 rounded-xl bg-[#1a1b1f] border border-white/5 text-slate-200 font-bold text-lg flex items-center justify-center">-</button>
                <input type="number" id="input-reps" placeholder="0" class="w-full bg-transparent text-center font-black text-xl text-[#d2fe1a] focus:outline-none" />
                <button onclick="adjustInput('input-reps', 1)" class="stepper-btn w-9 h-9 rounded-xl bg-[#1a1b1f] border border-white/5 text-slate-200 font-bold text-lg flex items-center justify-center">+</button>
              </div>
            </div>

          </div>

          <!-- Solid Action Button -->
          <button onclick="logCurrentSet()" class="w-full bg-[#d2fe1a] hover:bg-[#bfe613] text-slate-950 font-black py-4 rounded-2xl text-xs tracking-widest transition-all duration-300 shadow-lg shadow-[#d2fe1a]/15 active:scale-[0.98] uppercase">
            Log set
          </button>
        </div>
      </div>

      <!-- Completed Sets -->
      <div class="space-y-2.5 pt-1">
        <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest flex justify-between items-center px-1">
          <span>Today's Sets</span>
          <span id="session-count" class="text-[#d2fe1a] font-black">0 completed</span>
        </h3>
        <div id="session-sets-list" class="space-y-2 text-xs"></div>
      </div>
    </section>

    <!-- TAB 2: OVERLOAD & PROGRESS -->
    <section id="tab-history" class="space-y-4 hidden tab-pane">
      <h2 class="text-sm font-extrabold text-slate-100 uppercase tracking-widest pl-1">Progressive Overload</h2>
      <div class="relative">
        <select id="history-filter" onchange="renderHistory()" class="w-full appearance-none glass rounded-2xl px-4 py-3.5 text-xs font-bold text-slate-200 focus:outline-none focus:border-[#d2fe1a] pr-10"></select>
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-[#d2fe1a]">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
        </div>
      </div>
      <div id="history-timeline" class="space-y-3"></div>
    </section>

    <!-- TAB 3: MUSCLE VOLUMES -->
    <section id="tab-analytics" class="space-y-4 hidden tab-pane">
      <h2 class="text-sm font-extrabold text-slate-100 uppercase tracking-widest pl-1">Volume & Distribution</h2>
      <div class="grid grid-cols-2 gap-3">
        <div class="glass p-4 rounded-3xl">
          <span class="text-slate-500 text-[10px] font-bold uppercase tracking-wider block">Total Volume</span>
          <p id="stat-total-volume" class="text-lg font-black text-[#d2fe1a] mt-1.5">0 kg</p>
        </div>
        <div class="glass p-4 rounded-3xl">
          <span class="text-slate-500 text-[10px] font-bold uppercase tracking-wider block">Total Sets</span>
          <p id="stat-total-sets" class="text-lg font-black text-slate-100 mt-1.5">0</p>
        </div>
      </div>

      <div class="glass p-5 rounded-3xl space-y-4">
        <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest pl-1">Primary Muscle Load</h3>
        <div id="muscle-breakdown" class="space-y-3.5"></div>
      </div>
    </section>

    <!-- TAB 4: PROFILE & SETTINGS -->
    <section id="tab-profile" class="space-y-4 hidden tab-pane">
      <h2 class="text-sm font-extrabold text-slate-100 uppercase tracking-widest pl-1">Biometrics & Backups</h2>
      <div class="glass p-5 rounded-3xl space-y-4">
        <div>
          <label class="text-[10px] text-slate-500 font-bold uppercase tracking-widest block mb-1.5">Body Weight (kg)</label>
          <input type="number" id="input-bw" placeholder="0" step="0.5" class="w-full glass-input rounded-2xl p-3.5 text-sm font-bold text-slate-100 focus:border-[#d2fe1a] focus:outline-none" />
        </div>
        <div>
          <label class="text-[10px] text-slate-500 font-bold uppercase tracking-widest block mb-1.5">Height (cm)</label>
          <input type="number" id="input-height" placeholder="0" class="w-full glass-input rounded-2xl p-3.5 text-sm font-bold text-slate-100 focus:border-[#d2fe1a] focus:outline-none" />
        </div>
        <button onclick="saveUserProfile()" class="w-full bg-[#d2fe1a] hover:bg-[#bfe613] text-slate-950 font-black py-3 rounded-2xl text-xs tracking-widest transition-all">
          Update Biometrics
        </button>
      </div>

      <!-- Backup and Restore -->
      <div class="glass p-5 rounded-3xl space-y-4">
        <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest pl-1">Data Backup</h3>
        <div class="grid grid-cols-2 gap-2.5">
          <button onclick="exportData()" class="glass-input hover:border-white/10 py-3 rounded-2xl text-xs font-bold text-slate-300">Export JSON</button>
          <button onclick="document.getElementById('import-file').click()" class="glass-input hover:border-white/10 py-3 rounded-2xl text-xs font-bold text-slate-300">Import JSON</button>
          <input type="file" id="import-file" onchange="importData(event)" class="hidden" accept=".json" />
        </div>
      </div>
    </section>

  </main>

  <!-- Rest Stopwatch iOS Sheet-Style Modal -->
  <div id="timer-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md z-50 flex items-end sm:items-center justify-center p-4 hidden">
    <div class="glass rounded-t-[36px] sm:rounded-3xl p-6 w-full max-w-xs text-center space-y-5 border-x-0 border-b-0 sm:border-x sm:border-b transition-transform duration-300">
      <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Recovery Countdown</h3>
      <div id="modal-timer-countdown" class="text-5xl font-black text-[#d2fe1a] tracking-wider">00:00</div>
      <div class="grid grid-cols-3 gap-2">
        <button onclick="startRestTimer(60)" class="glass-input hover:border-[#d2fe1a]/20 py-2.5 rounded-xl text-xs font-bold text-slate-200">60s</button>
        <button onclick="startRestTimer(90)" class="glass-input hover:border-[#d2fe1a]/20 py-2.5 rounded-xl text-xs font-bold text-[#d2fe1a]">90s</button>
        <button onclick="startRestTimer(120)" class="glass-input hover:border-[#d2fe1a]/20 py-2.5 rounded-xl text-xs font-bold text-slate-200">120s</button>
      </div>
      <button onclick="toggleTimerModal()" class="w-full py-2.5 text-xs font-extrabold text-slate-500 hover:text-slate-300 uppercase tracking-widest">Dismiss</button>
    </div>
  </div>

  <!-- iOS Frosted Glass Bottom Float Bar -->
  <nav class="fixed bottom-4 left-4 right-4 max-w-md mx-auto glass rounded-[24px] p-2.5 z-40 shadow-2xl flex justify-around items-center">
    
    <button onclick="switchTab('log')" id="nav-log" class="flex flex-col items-center gap-1 text-[#d2fe1a] py-1.5 px-3.5 transition duration-200 scale-100">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
      <span class="text-[9px] font-bold uppercase tracking-wider">Log</span>
    </button>

    <button onclick="switchTab('history')" id="nav-history" class="flex flex-col items-center gap-1 text-slate-500 py-1.5 px-3.5 transition duration-200">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
      <span class="text-[9px] font-bold uppercase tracking-wider">Progress</span>
    </button>

    <button onclick="switchTab('analytics')" id="nav-analytics" class="flex flex-col items-center gap-1 text-slate-500 py-1.5 px-3.5 transition duration-200">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      <span class="text-[9px] font-bold uppercase tracking-wider">Volume</span>
    </button>

    <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center gap-1 text-slate-500 py-1.5 px-3.5 transition duration-200">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span class="text-[9px] font-bold uppercase tracking-wider">Profile</span>
    </button>

  </nav>

  <script>
    const ROUTINES = {
      "Push": [
        { name: "Incline DB. Press", muscle: "Upper Chest" },
        { name: "Cable Lat Raise", muscle: "Side Delts" },
        { name: "Machine Press (CL)", muscle: "Chest" },
        { name: "Overhead Tri. Ext. Bar", muscle: "Triceps" },
        { name: "Tri. Pushdown Bar", muscle: "Triceps" },
        { name: "Pec Fly (Upper/Lower)", muscle: "Chest" }
      ],
      "Pull": [
        { name: "Machine Pullovers", muscle: "Lats" },
        { name: "Wide Grip Row", muscle: "Upper Back" },
        { name: "Close grip Machine row", muscle: "Lats" },
        { name: "Cable Rear delt flys", muscle: "Rear Delts" },
        { name: "Shrugs", muscle: "Traps" },
        { name: "Bayesian Curl", muscle: "Biceps" },
        { name: "Hammer/Preacher Curl", muscle: "Biceps" }
      ],
      "Legs": [
        { name: "Hack Squat", muscle: "Quads" },
        { name: "Seated Hamstring Curl", muscle: "Hamstrings" },
        { name: "Leg Extension", muscle: "Quads" },
        { name: "Hip Adductor", muscle: "Adductors" },
        { name: "Hip Thrust", muscle: "Glutes" },
        { name: "Bayesian Curl", muscle: "Biceps" },
        { name: "Standing Calf Raise", muscle: "Calves" }
      ],
      "Arm-Shoulder": [
        { name: "Machine Shoulder Press", muscle: "Front Delts" },
        { name: "Bayesian Curl", muscle: "Biceps" },
        { name: "Cable Lateral Raise", muscle: "Side Delts" },
        { name: "Overhead Triceps Extension", muscle: "Triceps" },
        { name: "Preacher Curl", muscle: "Biceps" },
        { name: "Triceps Pushdown", muscle: "Triceps" }
      ]
    };

    let currentSplit = "Push";
    let logs = JSON.parse(localStorage.getItem("iron_logs") || "[]");
    let userProfile = JSON.parse(localStorage.getItem("iron_profile") || '{"weight": 70, "height": 175}');
    let restTimerInterval = null;
    let restTimeRemaining = 0;

    function init() {
      renderSplitButtons();
      populateExerciseSelect();
      updateProfileDisplay();
      renderExerciseDetails();
      renderTodaySession();
      populateHistoryFilter();
    }

    function switchTab(tabId) {
      ['log', 'history', 'analytics', 'profile'].forEach(t => {
        const pane = document.getElementById(`tab-${t}`);
        pane.classList.add('hidden');
        pane.style.opacity = '0';
        pane.style.transform = 'translateY(12px)';
        const navEl = document.getElementById(`nav-${t}`);
        navEl.classList.remove('text-[#d2fe1a]', 'scale-105');
        navEl.classList.add('text-slate-500');
      });
      
      const activePane = document.getElementById(`tab-${tabId}`);
      activePane.classList.remove('hidden');
      setTimeout(() => {
        activePane.style.opacity = '1';
        activePane.style.transform = 'translateY(0)';
      }, 50);

      const activeNav = document.getElementById(`nav-${tabId}`);
      activeNav.classList.remove('text-slate-500');
      activeNav.classList.add('text-[#d2fe1a]', 'scale-105');

      if (tabId === 'history') renderHistory();
      if (tabId === 'analytics') renderAnalytics();
      if (tabId === 'log') {
        renderExerciseDetails();
        renderTodaySession();
      }
    }

    function renderSplitButtons() {
      const container = document.getElementById('split-buttons');
      container.innerHTML = Object.keys(ROUTINES).map(split => `
        <button onclick="setSplit('${split}')" class="py-2.5 px-3 text-xs font-bold rounded-2xl border transition-all duration-300 active:scale-95 ${
          currentSplit === split 
            ? 'bg-[#d2fe1a]/15 text-[#d2fe1a] border-[#d2fe1a]/60 shadow-lg shadow-[#d2fe1a]/5' 
            : 'bg-transparent border-white/5 text-slate-400 hover:text-slate-200 hover:border-white/10'
        }">${split}</button>
      `).join('');
    }

    function setSplit(split) {
      currentSplit = split;
      renderSplitButtons();
      populateExerciseSelect();
      renderExerciseDetails();
    }

    function populateExerciseSelect() {
      const select = document.getElementById('exercise-select');
      const exercises = ROUTINES[currentSplit];
      select.innerHTML = exercises.map(ex => `<option value="${ex.name}">${ex.name}</option>`).join('');
    }

    function getSelectedExerciseObj() {
      const exName = document.getElementById('exercise-select').value;
      for (const split in ROUTINES) {
        const found = ROUTINES[split].find(e => e.name === exName);
        if (found) return found;
      }
      return { name: exName, muscle: "Other" };
    }

    function renderExerciseDetails() {
      const ex = getSelectedExerciseObj();
      document.getElementById('target-muscle-badge').innerText = ex.muscle;

      const exerciseLogs = logs.filter(l => l.exercise === ex.name);
      const prevDisplay = document.getElementById('prev-log-display');
      const ratingBadge = document.getElementById('lift-rating-badge');

      if (exerciseLogs.length === 0) {
        prevDisplay.innerHTML = `<span class="text-slate-500 italic">No logged lifts for this exercise.</span>`;
        ratingBadge.innerText = "Rating: --";
        return;
      }

      const latestDate = exerciseLogs[exerciseLogs.length - 1].date;
      const latestSessionSets = exerciseLogs.filter(l => l.date === latestDate);
      prevDisplay.innerHTML = `<span class="text-slate-400 font-bold">${latestDate}:</span> ` + latestSessionSets.map((s, i) => `S${i+1}: <strong>${s.weight}kg × ${s.reps}</strong>`).join(', ');

      let maxE1RM = 0;
      exerciseLogs.forEach(s => {
        const e1rm = s.weight * (1 + s.reps / 30);
        if (e1rm > maxE1RM) maxE1RM = e1rm;
      });

      const bw = userProfile.weight || 70;
      const ratio = (maxE1RM / bw).toFixed(2);
      let tier = "Beginner";
      if (ratio >= 1.5) tier = "Advanced";
      else if (ratio >= 1.1) tier = "Intermediate";
      else if (ratio >= 0.75) tier = "Novice";

      ratingBadge.innerText = `Rating: ${tier} (${ratio}x BW)`;
    }

    function adjustInput(id, delta) {
      const el = document.getElementById(id);
      let val = parseFloat(el.value) || 0;
      val = Math.max(0, val + delta);
      el.value = (val % 1 !== 0) ? val.toFixed(1) : val;
    }

    function logCurrentSet() {
      const weight = parseFloat(document.getElementById('input-weight').value);
      const reps = parseInt(document.getElementById('input-reps').value, 10);
      const ex = getSelectedExerciseObj();

      if (isNaN(weight) || isNaN(reps) || reps <= 0) {
        alert("Please enter a valid weight and reps count.");
        return;
      }

      const today = new Date().toISOString().split('T')[0];
      const entry = {
        id: Date.now() + Math.random(),
        date: today,
        split: currentSplit,
        exercise: ex.name,
        muscle: ex.muscle,
        weight: weight,
        reps: reps,
        volume: weight * reps
      };

      logs.push(entry);
      localStorage.setItem("iron_logs", JSON.stringify(logs));

      document.getElementById('input-reps').value = '';
      renderExerciseDetails();
      renderTodaySession();
      startRestTimer(90);
    }

    function deleteSet(setId) {
      if (!confirm("Delete this set?")) return;
      logs = logs.filter(l => l.id !== setId);
      localStorage.setItem("iron_logs", JSON.stringify(logs));
      renderExerciseDetails();
      renderTodaySession();
      renderHistory();
      renderAnalytics();
    }

    function renderTodaySession() {
      const today = new Date().toISOString().split('T')[0];
      const list = document.getElementById('session-sets-list');
      const todaySets = logs.filter(l => l.date === today);
      document.getElementById('session-count').innerText = `${todaySets.length} sets logged`;

      if (todaySets.length === 0) {
        list.innerHTML = `<p class="text-slate-500 italic text-center py-2.5">No sets recorded yet today.</p>`;
        return;
      }

      list.innerHTML = todaySets.slice().reverse().map(s => `
        <div class="glass p-3 rounded-2xl flex justify-between items-center transition-all animate-[slideIn_0.35s_ease-out]">
          <div>
            <div class="font-extrabold text-slate-100 text-xs">${s.exercise}</div>
            <div class="text-[9px] text-[#d2fe1a] font-bold tracking-wider uppercase">${s.muscle}</div>
          </div>
          <div class="flex items-center gap-3.5">
            <div class="text-right">
              <span class="font-black text-sm text-[#d2fe1a]">${s.weight} kg × ${s.reps}</span>
              <span class="text-slate-500 text-[9px] block font-bold uppercase tracking-wide">${s.volume.toLocaleString()} kg vol</span>
            </div>
            <button onclick="deleteSet(${s.id})" class="text-rose-400 hover:text-rose-300 p-2 rounded-xl bg-[#111215] border border-white/5 active:scale-90 transition-all duration-200">
              <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </div>
        </div>
      `).join('');
    }

    function populateHistoryFilter() {
      const select = document.getElementById('history-filter');
      const allExercises = [];
      Object.values(ROUTINES).forEach(list => list.forEach(item => {
        if (!allExercises.includes(item.name)) allExercises.push(item.name);
      }));
      select.innerHTML = allExercises.map(e => `<option value="${e}">${e}</option>`).join('');
    }

    function renderHistory() {
      const selected = document.getElementById('history-filter').value;
      const historyList = logs.filter(l => l.exercise === selected);
      const container = document.getElementById('history-timeline');

      if (historyList.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500 py-4 text-center">No logs found for ${selected}.</p>`;
        return;
      }

      const grouped = {};
      historyList.forEach(s => {
        if (!grouped[s.date]) grouped[s.date] = [];
        grouped[s.date].push(s);
      });

      const dates = Object.keys(grouped).sort();
      let html = '';
      let prevBest1RM = 0;

      dates.forEach(d => {
        const sets = grouped[d];
        const dayVol = sets.reduce((acc, s) => acc + s.volume, 0);
        const dayMax1RM = Math.max(...sets.map(s => s.weight * (1 + s.reps / 30)));

        let overloadNotice = '';
        let glowClass = '';
        if (prevBest1RM > 0) {
          if (dayMax1RM > prevBest1RM) {
            overloadNotice = `<span class="text-[#d2fe1a] font-black tracking-widest text-[9px] bg-[#d2fe1a]/10 px-2.5 py-0.5 rounded-full border border-[#d2fe1a]/25 ml-1.5 uppercase">▲ OVERLOAD</span>`;
            glowClass = 'overload-glow';
          } else if (dayMax1RM < prevBest1RM) {
            overloadNotice = `<span class="text-rose-400 font-bold text-[9px] ml-1.5">▼ Drop</span>`;
          }
        }
        prevBest1RM = dayMax1RM;

        html += `
          <div class="glass p-4 rounded-3xl space-y-2.5 transition-all ${glowClass}">
            <div class="flex justify-between items-center border-b border-white/5 pb-2">
              <span class="font-extrabold text-slate-100">${d} ${overloadNotice}</span>
              <span class="text-[#d2fe1a] font-extrabold">${dayVol.toLocaleString()} kg</span>
            </div>
            <div class="space-y-1.5 pt-0.5">
              ${sets.map((s, idx) => `
                <div class="flex justify-between items-center bg-slate-950/45 px-3 py-2 rounded-2xl border border-white/5">
                  <span class="text-slate-300">Set ${idx+1}: <strong class="text-slate-100">${s.weight}kg × ${s.reps}</strong></span>
                  <button onclick="deleteSet(${s.id})" class="text-rose-400 hover:text-rose-300 text-[10px] font-extrabold px-3 py-1.5 rounded-xl bg-rose-950/30 border border-rose-900/50">Delete</button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function renderAnalytics() {
      const totalVol = logs.reduce((acc, s) => acc + s.volume, 0);
      document.getElementById('stat-total-volume').innerText = `${totalVol.toLocaleString()} kg`;
      document.getElementById('stat-total-sets').innerText = logs.length;

      const muscleVol = {};
      logs.forEach(s => {
        muscleVol[s.muscle] = (muscleVol[s.muscle] || 0) + s.volume;
      });

      const sortedMuscles = Object.entries(muscleVol).sort((a, b) => b[1] - a[1]);
      const breakdownEl = document.getElementById('muscle-breakdown');

      if (sortedMuscles.length === 0) {
        breakdownEl.innerHTML = `<p class="text-xs text-slate-500 py-4 text-center">Log workouts to see distribution.</p>`;
        return;
      }

      const maxMVol = sortedMuscles[0][1] || 1;
      breakdownEl.innerHTML = sortedMuscles.map(([muscle, vol]) => {
        const pct = Math.round((vol / maxMVol) * 100);
        return `
          <div class="space-y-2">
            <div class="flex justify-between text-xs items-center">
              <span class="font-bold text-slate-300">${muscle}</span>
              <span class="text-slate-400 font-bold">${vol.toLocaleString()} kg</span>
            </div>
            <div class="w-full bg-slate-950 rounded-full h-2.5 overflow-hidden border border-white/5 p-[1.5px]">
              <div class="bg-gradient-to-r from-[#d2fe1a] to-emerald-400 h-full rounded-full transition-all duration-1000" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    /* Rest Timer Logic */
    function toggleTimerModal() {
      const modal = document.getElementById('timer-modal');
      modal.classList.toggle('hidden');
    }

    function startRestTimer(seconds) {
      clearInterval(restTimerInterval);
      restTimeRemaining = seconds;
      updateTimerDisplay();
      document.getElementById('timer-modal').classList.add('hidden');

      restTimerInterval = setInterval(() => {
        restTimeRemaining--;
        updateTimerDisplay();
        if (restTimeRemaining <= 0) {
          clearInterval(restTimerInterval);
          document.getElementById('timer-display').innerText = "DONE";
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const m = Math.floor(restTimeRemaining / 60);
      const s = restTimeRemaining % 60;
      const str = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      document.getElementById('timer-display').innerText = str;
      document.getElementById('modal-timer-countdown').innerText = str;
    }

    /* Backup / Restore */
    function exportData() {
      const blob = new Blob([JSON.stringify({ logs, userProfile })], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `KenjiLifts_Backup_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);
          if (data.logs) logs = data.logs;
          if (data.userProfile) userProfile = data.userProfile;
          localStorage.setItem("iron_logs", JSON.stringify(logs));
          localStorage.setItem("iron_profile", JSON.stringify(userProfile));
          init();
          alert("Backup restored!");
        } catch (err) {
          alert("Invalid file format.");
        }
      };
      reader.readAsText(file);
    }

    function saveUserProfile() {
      const w = parseFloat(document.getElementById('input-bw').value);
      const h = parseFloat(document.getElementById('input-height').value);
      if (w) userProfile.weight = w;
      if (h) userProfile.height = h;
      localStorage.setItem("iron_profile", JSON.stringify(userProfile));
      updateProfileDisplay();
      renderExerciseDetails();
      alert("Biometrics Updated!");
    }

    function updateProfileDisplay() {
      document.getElementById('user-stats-banner').innerText = `BW: ${userProfile.weight || '--'} kg | Ht: ${userProfile.height || '--'} cm`;
      document.getElementById('input-bw').value = userProfile.weight || '';
      document.getElementById('input-height').value = userProfile.height || '';
    }

    window.onload = init;
  </script>
</body>
</html>
