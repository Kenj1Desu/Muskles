<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#080b11" />
  <title>Kenji Lifts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #080b11;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .glass {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .stepper-btn:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body class="pb-28">

  <!-- Sticky Top App Bar -->
  <header class="glass border-b border-slate-800/80 sticky top-0 z-40 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-2.5">
      <!-- Barbells Logo -->
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-cyan-500/20">
        <svg class="w-5 h-5 text-slate-950" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2 10.5a1.5 1.5 0 0 1 1.5-1.5h1a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-1A1.5 1.5 0 0 1 2 13.5v-3zm4 1a1 1 0 0 1 1-1h1v5H7a1 1 0 0 1-1-1v-3zm12-1h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v-5zm2-1.5a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-1a1.5 1.5 0 0 1-1.5-1.5v-3a1.5 1.5 0 0 1 1.5-1.5h1zM8 11.25h8v1.5H8v-1.5z"/>
        </svg>
      </div>
      <div>
        <h1 class="text-base font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-cyan-300 bg-clip-text text-transparent">KENJI LIFTS</h1>
        <p id="user-stats-banner" class="text-[11px] text-slate-400 font-medium tracking-wide">BW: -- kg</p>
      </div>
    </div>
    
    <!-- Quick Rest Stopwatch Badge -->
    <button onclick="toggleTimerModal()" id="timer-badge" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-900 border border-slate-700/80 hover:border-cyan-500/50 text-xs font-semibold text-cyan-400 transition">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span id="timer-display">Rest</span>
    </button>
  </header>

  <!-- Main Container -->
  <main class="p-4 max-w-md mx-auto space-y-4">

    <!-- TAB 1: WORKOUT LOGGING -->
    <section id="tab-log" class="space-y-4">
      
      <!-- Split Pills -->
      <div class="space-y-1.5">
        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Select Workout Split</label>
        <div class="grid grid-cols-2 gap-2" id="split-buttons"></div>
      </div>

      <!-- Exercise Selector Dropdown -->
      <div class="space-y-1.5">
        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Exercise</label>
        <div class="relative">
          <select id="exercise-select" onchange="renderExerciseDetails()" class="w-full appearance-none bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm font-semibold text-slate-100 focus:outline-none focus:border-cyan-400 pr-10 shadow-sm"></select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </div>
        </div>
      </div>

      <!-- Live Exercise Card -->
      <div class="bg-gradient-to-b from-slate-900 to-slate-900/90 border border-slate-800 rounded-2xl p-4 space-y-3.5 shadow-xl">
        <div class="flex justify-between items-center">
          <span id="target-muscle-badge" class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-cyan-950/80 text-cyan-300 border border-cyan-800/80 tracking-wide">Chest</span>
          <span id="lift-rating-badge" class="text-xs font-bold text-amber-400">Rating: --</span>
        </div>

        <!-- Last Log Banner -->
        <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800/80 text-xs">
          <span class="text-slate-400 font-semibold block mb-1">Previous Session:</span>
          <p id="prev-log-display" class="text-slate-300 italic">No previous logs for this exercise yet.</p>
        </div>

        <!-- Stepper Input Section -->
        <div class="space-y-3 pt-1">
          <div class="grid grid-cols-2 gap-3">
            
            <!-- Weight Input with Steppers -->
            <div class="bg-slate-950/70 p-2.5 rounded-xl border border-slate-800 space-y-1.5">
              <label class="text-[11px] font-medium text-slate-400 block text-center">Weight (kg)</label>
              <div class="flex items-center gap-1.5">
                <button onclick="adjustInput('input-weight', -2.5)" class="stepper-btn w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 text-slate-200 font-bold flex items-center justify-center hover:bg-slate-700">-</button>
                <input type="number" id="input-weight" placeholder="0" step="0.5" class="w-full bg-transparent text-center font-extrabold text-lg text-cyan-400 focus:outline-none" />
                <button onclick="adjustInput('input-weight', 2.5)" class="stepper-btn w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 text-slate-200 font-bold flex items-center justify-center hover:bg-slate-700">+</button>
              </div>
            </div>

            <!-- Reps Input with Steppers -->
            <div class="bg-slate-950/70 p-2.5 rounded-xl border border-slate-800 space-y-1.5">
              <label class="text-[11px] font-medium text-slate-400 block text-center">Reps</label>
              <div class="flex items-center gap-1.5">
                <button onclick="adjustInput('input-reps', -1)" class="stepper-btn w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 text-slate-200 font-bold flex items-center justify-center hover:bg-slate-700">-</button>
                <input type="number" id="input-reps" placeholder="0" class="w-full bg-transparent text-center font-extrabold text-lg text-emerald-400 focus:outline-none" />
                <button onclick="adjustInput('input-reps', 1)" class="stepper-btn w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 text-slate-200 font-bold flex items-center justify-center hover:bg-slate-700">+</button>
              </div>
            </div>

          </div>

          <!-- Log Button -->
          <button onclick="logCurrentSet()" class="w-full bg-gradient-to-r from-cyan-500 to-cyan-400 hover:from-cyan-400 hover:to-cyan-300 text-slate-950 font-extrabold py-3 rounded-xl text-sm transition shadow-lg shadow-cyan-500/25 active:scale-[0.98]">
            LOG SET
          </button>
        </div>
      </div>

      <!-- Today's Sets Stream -->
      <div class="space-y-2 pt-2">
        <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex justify-between items-center">
          <span>Today's Sets</span>
          <span id="session-count" class="text-cyan-400">0 completed</span>
        </h3>
        <div id="session-sets-list" class="space-y-2 text-xs"></div>
      </div>
    </section>

    <!-- TAB 2: OVERLOAD & PROGRESS -->
    <section id="tab-history" class="space-y-4 hidden">
      <div class="flex justify-between items-center">
        <h2 class="text-base font-extrabold text-slate-100">Progressive Overload</h2>
      </div>
      <div class="relative">
        <select id="history-filter" onchange="renderHistory()" class="w-full appearance-none bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs font-semibold text-slate-200 focus:outline-none focus:border-cyan-400 pr-10"></select>
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </div>
      </div>
      <div id="history-timeline" class="space-y-3"></div>
    </section>

    <!-- TAB 3: MUSCLE VOLUMES -->
    <section id="tab-analytics" class="space-y-4 hidden">
      <h2 class="text-base font-extrabold text-slate-100">Volume & Muscle Load</h2>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800">
          <span class="text-slate-400 text-xs font-medium">Total Volume</span>
          <p id="stat-total-volume" class="text-xl font-black text-cyan-400 mt-1">0 kg</p>
        </div>
        <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800">
          <span class="text-slate-400 text-xs font-medium">Total Sets</span>
          <p id="stat-total-sets" class="text-xl font-black text-emerald-400 mt-1">0</p>
        </div>
      </div>

      <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 space-y-3">
        <h3 class="text-xs font-extrabold text-slate-300 uppercase tracking-wider">Target Muscle Distribution</h3>
        <div id="muscle-breakdown" class="space-y-2.5"></div>
      </div>
    </section>

    <!-- TAB 4: PROFILE & SETTINGS -->
    <section id="tab-profile" class="space-y-4 hidden">
      <h2 class="text-base font-extrabold text-slate-100">Profile & Benchmarks</h2>
      <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 space-y-3">
        <div>
          <label class="text-xs text-slate-400 block mb-1 font-medium">Body Weight (kg)</label>
          <input type="number" id="input-bw" placeholder="Weight in kg" step="0.5" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm font-semibold text-slate-100 focus:border-cyan-400 focus:outline-none" />
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1 font-medium">Height (cm)</label>
          <input type="number" id="input-height" placeholder="Height in cm" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm font-semibold text-slate-100 focus:border-cyan-400 focus:outline-none" />
        </div>
        <button onclick="saveUserProfile()" class="w-full bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 font-bold py-2.5 rounded-xl text-sm transition">
          Update Stats
        </button>
      </div>

      <!-- Backup and Restore -->
      <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 space-y-3">
        <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Data Backup</h3>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="exportData()" class="bg-slate-950 border border-slate-800 hover:border-slate-700 py-2.5 rounded-xl text-xs font-semibold text-slate-300">Export Backup</button>
          <button onclick="document.getElementById('import-file').click()" class="bg-slate-950 border border-slate-800 hover:border-slate-700 py-2.5 rounded-xl text-xs font-semibold text-slate-300">Import Backup</button>
          <input type="file" id="import-file" onchange="importData(event)" class="hidden" accept=".json" />
        </div>
      </div>
    </section>

  </main>

  <!-- Rest Stopwatch Modal -->
  <div id="timer-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-xs text-center space-y-4">
      <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider">Rest Timer</h3>
      <div id="modal-timer-countdown" class="text-4xl font-black text-cyan-400">00:00</div>
      <div class="grid grid-cols-3 gap-2">
        <button onclick="startRestTimer(60)" class="bg-slate-800 hover:bg-slate-700 py-2 rounded-lg text-xs font-bold text-slate-200">60s</button>
        <button onclick="startRestTimer(90)" class="bg-slate-800 hover:bg-slate-700 py-2 rounded-lg text-xs font-bold text-slate-200">90s</button>
        <button onclick="startRestTimer(120)" class="bg-slate-800 hover:bg-slate-700 py-2 rounded-lg text-xs font-bold text-slate-200">120s</button>
      </div>
      <button onclick="toggleTimerModal()" class="w-full py-2 text-xs font-bold text-slate-400 hover:text-slate-200">Close</button>
    </div>
  </div>

  <!-- Modern Floating Dock Navigation -->
  <nav class="fixed bottom-3 left-4 right-4 max-w-md mx-auto glass border border-slate-800/80 rounded-2xl p-2 z-40 shadow-2xl flex justify-around items-center">
    
    <button onclick="switchTab('log')" id="nav-log" class="flex flex-col items-center gap-1 text-cyan-400 py-1 px-3 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      <span class="text-[10px] font-bold">Log</span>
    </button>

    <button onclick="switchTab('history')" id="nav-history" class="flex flex-col items-center gap-1 text-slate-500 py-1 px-3 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
      <span class="text-[10px] font-bold">Overload</span>
    </button>

    <button onclick="switchTab('analytics')" id="nav-analytics" class="flex flex-col items-center gap-1 text-slate-500 py-1 px-3 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      <span class="text-[10px] font-bold">Volume</span>
    </button>

    <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center gap-1 text-slate-500 py-1 px-3 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span class="text-[10px] font-bold">Profile</span>
    </button>

  </nav>

  <script>
    const ROUTINES = {
      "Push": [
        { name: "Incline DB. Press", muscle: "Upper Chest" },
        { name: "Cable Lat Raise", muscle: "Side Delts" },
        { name: "Machine Press (CL)", muscle: "Chest" },
        { name: "Overhead Tri. Ext. Bar", muscle: "Triceps" },
        { name: "Tri. Pushdown Bar", muscle: "Triceps" },
        { name: "Pec Fly (Upper/Lower)", muscle: "Chest" }
      ],
      "Pull": [
        { name: "Machine Pullovers", muscle: "Lats" },
        { name: "Wide Grip Row", muscle: "Upper Back" },
        { name: "Close grip Machine row", muscle: "Lats" },
        { name: "Cable Rear delt flys", muscle: "Rear Delts" },
        { name: "Shrugs", muscle: "Traps" },
        { name: "Bayesian Curl", muscle: "Biceps" },
        { name: "Hammer/Preacher Curl", muscle: "Biceps" }
      ],
      "Legs": [
        { name: "Hack Squat", muscle: "Quads" },
        { name: "Seated Hamstring Curl", muscle: "Hamstrings" },
        { name: "Leg Extension", muscle: "Quads" },
        { name: "Hip Adductor", muscle: "Adductors" },
        { name: "Hip Thrust", muscle: "Glutes" },
        { name: "Bayesian Curl", muscle: "Biceps" },
        { name: "Standing Calf Raise", muscle: "Calves" }
      ],
      "Arm-Shoulder": [
        { name: "Machine Shoulder Press", muscle: "Front Delts" },
        { name: "Bayesian Curl", muscle: "Biceps" },
        { name: "Cable Lateral Raise", muscle: "Side Delts" },
        { name: "Overhead Triceps Extension", muscle: "Triceps" },
        { name: "Preacher Curl", muscle: "Biceps" },
        { name: "Triceps Pushdown", muscle: "Triceps" }
      ]
    };

    let currentSplit = "Push";
    let logs = JSON.parse(localStorage.getItem("iron_logs") || "[]");
    let userProfile = JSON.parse(localStorage.getItem("iron_profile") || '{"weight": 70, "height": 175}');
    let restTimerInterval = null;
    let restTimeRemaining = 0;

    function init() {
      renderSplitButtons();
      populateExerciseSelect();
      updateProfileDisplay();
      renderExerciseDetails();
      renderTodaySession();
      populateHistoryFilter();
    }

    function switchTab(tabId) {
      ['log', 'history', 'analytics', 'profile'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        const navEl = document.getElementById(`nav-${t}`);
        navEl.classList.remove('text-cyan-400');
        navEl.classList.add('text-slate-500');
      });
      document.getElementById(`tab-${tabId}`).classList.remove('hidden');
      const activeNav = document.getElementById(`nav-${tabId}`);
      activeNav.classList.remove('text-slate-500');
      activeNav.classList.add('text-cyan-400');

      if (tabId === 'history') renderHistory();
      if (tabId === 'analytics') renderAnalytics();
      if (tabId === 'log') {
        renderExerciseDetails();
        renderTodaySession();
      }
    }

    function renderSplitButtons() {
      const container = document.getElementById('split-buttons');
      container.innerHTML = Object.keys(ROUTINES).map(split => `
        <button onclick="setSplit('${split}')" class="py-2.5 px-3 text-xs font-bold rounded-xl border transition ${
          currentSplit === split 
            ? 'bg-cyan-500/15 text-cyan-300 border-cyan-500/80 shadow-md shadow-cyan-500/10' 
            : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'
        }">${split}</button>
      `).join('');
    }

    function setSplit(split) {
      currentSplit = split;
      renderSplitButtons();
      populateExerciseSelect();
      renderExerciseDetails();
    }

    function populateExerciseSelect() {
      const select = document.getElementById('exercise-select');
      const exercises = ROUTINES[currentSplit];
      select.innerHTML = exercises.map(ex => `<option value="${ex.name}">${ex.name}</option>`).join('');
    }

    function getSelectedExerciseObj() {
      const exName = document.getElementById('exercise-select').value;
      for (const split in ROUTINES) {
        const found = ROUTINES[split].find(e => e.name === exName);
        if (found) return found;
      }
      return { name: exName, muscle: "Other" };
    }

    function renderExerciseDetails() {
      const ex = getSelectedExerciseObj();
      document.getElementById('target-muscle-badge').innerText = ex.muscle;

      const exerciseLogs = logs.filter(l => l.exercise === ex.name);
      const prevDisplay = document.getElementById('prev-log-display');
      const ratingBadge = document.getElementById('lift-rating-badge');

      if (exerciseLogs.length === 0) {
        prevDisplay.innerText = "No previous logs for this exercise yet.";
        ratingBadge.innerText = "Rating: --";
        return;
      }

      const latestDate = exerciseLogs[exerciseLogs.length - 1].date;
      const latestSessionSets = exerciseLogs.filter(l => l.date === latestDate);
      prevDisplay.innerHTML = `<span class="text-slate-400 font-bold">${latestDate}:</span> ` + latestSessionSets.map((s, i) => `S${i+1}: <strong>${s.weight}kg × ${s.reps}</strong>`).join(', ');

      let maxE1RM = 0;
      exerciseLogs.forEach(s => {
        const e1rm = s.weight * (1 + s.reps / 30);
        if (e1rm > maxE1RM) maxE1RM = e1rm;
      });

      const bw = userProfile.weight || 70;
      const ratio = (maxE1RM / bw).toFixed(2);
      let tier = "Beginner";
      if (ratio >= 1.5) tier = "Advanced";
      else if (ratio >= 1.1) tier = "Intermediate";
      else if (ratio >= 0.75) tier = "Novice";

      ratingBadge.innerText = `Rating: ${tier} (${ratio}x BW)`;
    }

    function adjustInput(id, delta) {
      const el = document.getElementById(id);
      let val = parseFloat(el.value) || 0;
      val = Math.max(0, val + delta);
      el.value = (val % 1 !== 0) ? val.toFixed(1) : val;
    }

    function logCurrentSet() {
      const weight = parseFloat(document.getElementById('input-weight').value);
      const reps = parseInt(document.getElementById('input-reps').value, 10);
      const ex = getSelectedExerciseObj();

      if (isNaN(weight) || isNaN(reps) || reps <= 0) {
        alert("Please enter a valid weight and reps count.");
        return;
      }

      const today = new Date().toISOString().split('T')[0];
      const entry = {
        id: Date.now() + Math.random(),
        date: today,
        split: currentSplit,
        exercise: ex.name,
        muscle: ex.muscle,
        weight: weight,
        reps: reps,
        volume: weight * reps
      };

      logs.push(entry);
      localStorage.setItem("iron_logs", JSON.stringify(logs));

      document.getElementById('input-reps').value = '';
      renderExerciseDetails();
      renderTodaySession();
      startRestTimer(90); // automatically initiate rest timer
    }

    function deleteSet(setId) {
      if (!confirm("Delete this set?")) return;
      logs = logs.filter(l => l.id !== setId);
      localStorage.setItem("iron_logs", JSON.stringify(logs));
      renderExerciseDetails();
      renderTodaySession();
      renderHistory();
      renderAnalytics();
    }

    function renderTodaySession() {
      const today = new Date().toISOString().split('T')[0];
      const list = document.getElementById('session-sets-list');
      const todaySets = logs.filter(l => l.date === today);
      document.getElementById('session-count').innerText = `${todaySets.length} sets logged`;

      if (todaySets.length === 0) {
        list.innerHTML = `<p class="text-slate-500 italic text-center py-2">No sets recorded yet today.</p>`;
        return;
      }

      list.innerHTML = todaySets.slice().reverse().map(s => `
        <div class="bg-slate-900 border border-slate-800/80 p-3 rounded-xl flex justify-between items-center">
          <div>
            <div class="font-bold text-slate-200 text-xs">${s.exercise}</div>
            <div class="text-[10px] text-cyan-400 font-semibold tracking-wide">${s.muscle}</div>
          </div>
          <div class="flex items-center gap-3">
            <div class="text-right">
              <span class="font-extrabold text-sm text-cyan-300">${s.weight} kg × ${s.reps}</span>
              <span class="text-slate-500 text-[10px] block font-medium">${s.volume.toLocaleString()} kg vol</span>
            </div>
            <button onclick="deleteSet(${s.id})" class="text-rose-400 hover:text-rose-300 p-1.5 rounded-lg bg-slate-950 border border-slate-800">
              <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </div>
        </div>
      `).join('');
    }

    function populateHistoryFilter() {
      const select = document.getElementById('history-filter');
      const allExercises = [];
      Object.values(ROUTINES).forEach(list => list.forEach(item => {
        if (!allExercises.includes(item.name)) allExercises.push(item.name);
      }));
      select.innerHTML = allExercises.map(e => `<option value="${e}">${e}</option>`).join('');
    }

    function renderHistory() {
      const selected = document.getElementById('history-filter').value;
      const historyList = logs.filter(l => l.exercise === selected);
      const container = document.getElementById('history-timeline');

      if (historyList.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500">No logs found for ${selected}.</p>`;
        return;
      }

      const grouped = {};
      historyList.forEach(s => {
        if (!grouped[s.date]) grouped[s.date] = [];
        grouped[s.date].push(s);
      });

      const dates = Object.keys(grouped).sort();
      let html = '';
      let prevBest1RM = 0;

      dates.forEach(d => {
        const sets = grouped[d];
        const dayVol = sets.reduce((acc, s) => acc + s.volume, 0);
        const dayMax1RM = Math.max(...sets.map(s => s.weight * (1 + s.reps / 30)));

        let overloadNotice = '';
        if (prevBest1RM > 0) {
          if (dayMax1RM > prevBest1RM) {
            overloadNotice = `<span class="text-emerald-400 font-bold ml-1">▲ Overload</span>`;
          } else if (dayMax1RM < prevBest1RM) {
            overloadNotice = `<span class="text-rose-400 ml-1">▼</span>`;
          }
        }
        prevBest1RM = dayMax1RM;

        html += `
          <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-xl text-xs space-y-2">
            <div class="flex justify-between items-center border-b border-slate-800/80 pb-2">
              <span class="font-bold text-slate-200">${d} ${overloadNotice}</span>
              <span class="text-cyan-400 font-bold">${dayVol.toLocaleString()} kg total vol</span>
            </div>
            <div class="space-y-1.5 pt-1">
              ${sets.map((s, idx) => `
                <div class="flex justify-between items-center bg-slate-950/60 px-2.5 py-1.5 rounded-lg border border-slate-800/60">
                  <span class="text-slate-300">Set ${idx+1}: <strong class="text-cyan-400">${s.weight}kg × ${s.reps}</strong></span>
                  <button onclick="deleteSet(${s.id})" class="text-rose-400 hover:text-rose-300 text-[11px] px-2 py-0.5 rounded bg-rose-950/30 border border-rose-900/50">Delete</button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function renderAnalytics() {
      const totalVol = logs.reduce((acc, s) => acc + s.volume, 0);
      document.getElementById('stat-total-volume').innerText = `${totalVol.toLocaleString()} kg`;
      document.getElementById('stat-total-sets').innerText = logs.length;

      const muscleVol = {};
      logs.forEach(s => {
        muscleVol[s.muscle] = (muscleVol[s.muscle] || 0) + s.volume;
      });

      const sortedMuscles = Object.entries(muscleVol).sort((a, b) => b[1] - a[1]);
      const breakdownEl = document.getElementById('muscle-breakdown');

      if (sortedMuscles.length === 0) {
        breakdownEl.innerHTML = `<p class="text-xs text-slate-500">Log workouts to see muscle distribution.</p>`;
        return;
      }

      const maxMVol = sortedMuscles[0][1] || 1;
      breakdownEl.innerHTML = sortedMuscles.map(([muscle, vol]) => {
        const pct = Math.round((vol / maxMVol) * 100);
        return `
          <div class="space-y-1.5">
            <div class="flex justify-between text-xs">
              <span class="font-bold text-slate-300">${muscle}</span>
              <span class="text-slate-400 font-medium">${vol.toLocaleString()} kg</span>
            </div>
            <div class="w-full bg-slate-950 rounded-full h-2 overflow-hidden border border-slate-800">
              <div class="bg-gradient-to-r from-cyan-500 to-emerald-400 h-2 rounded-full" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    /* Rest Timer Logic */
    function toggleTimerModal() {
      document.getElementById('timer-modal').classList.toggle('hidden');
    }

    function startRestTimer(seconds) {
      clearInterval(restTimerInterval);
      restTimeRemaining = seconds;
      updateTimerDisplay();
      document.getElementById('timer-modal').classList.add('hidden');

      restTimerInterval = setInterval(() => {
        restTimeRemaining--;
        updateTimerDisplay();
        if (restTimeRemaining <= 0) {
          clearInterval(restTimerInterval);
          document.getElementById('timer-display').innerText = "Rest Done!";
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const m = Math.floor(restTimeRemaining / 60);
      const s = restTimeRemaining % 60;
      const str = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      document.getElementById('timer-display').innerText = str;
      document.getElementById('modal-timer-countdown').innerText = str;
    }

    /* Backup / Restore */
    function exportData() {
      const blob = new Blob([JSON.stringify({ logs, userProfile })], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `KenjiLifts_Backup_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);
          if (data.logs) logs = data.logs;
          if (data.userProfile) userProfile = data.userProfile;
          localStorage.setItem("iron_logs", JSON.stringify(logs));
          localStorage.setItem("iron_profile", JSON.stringify(userProfile));
          init();
          alert("Backup restored successfully!");
        } catch (err) {
          alert("Invalid backup file.");
        }
      };
      reader.readAsText(file);
    }

    function saveUserProfile() {
      const w = parseFloat(document.getElementById('input-bw').value);
      const h = parseFloat(document.getElementById('input-height').value);
      if (w) userProfile.weight = w;
      if (h) userProfile.height = h;
      localStorage.setItem("iron_profile", JSON.stringify(userProfile));
      updateProfileDisplay();
      renderExerciseDetails();
      alert("Profile updated!");
    }

    function updateProfileDisplay() {
      document.getElementById('user-stats-banner').innerText = `BW: ${userProfile.weight || '--'} kg | Ht: ${userProfile.height || '--'} cm`;
      document.getElementById('input-bw').value = userProfile.weight || '';
      document.getElementById('input-height').value = userProfile.height || '';
    }

    window.onload = init;
  </script>
</body>
</html>
